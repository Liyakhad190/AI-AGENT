[alembic]

# path to migration scripts
script_location = app/database/migrations

# database url (overridden by env DATABASE_URL)
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_locations = app/database/migrations/versions

# timezone to use when rendering the date
# within the migration file
# template_args =

[post_write_hooks]

# hooks to run after a new revision is created
post_write_hooks = script

[post_write_hooks.script]
type = console_output

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
